<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Mes Souvenirs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #fdf0f5;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            max-width: 550px;
            width: 100%;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #e8b4d8, #c9a0d4);
            color: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(201, 160, 212, 0.3);
        }

        .header h1 {
            font-size: 1.6rem;
        }

        .header .subtitle {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .header .nav-link {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: rgba(255,255,255,0.25);
            color: white;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .header .nav-link:hover {
            background: rgba(255,255,255,0.4);
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(201, 160, 212, 0.1);
            border: 1px solid #f5e8f0;
        }

        .card h2 {
            font-size: 1rem;
            color: #6b4c7a;
            margin-bottom: 12px;
        }

        /* ===== LOGIN ===== */
        .login-container {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 4px 20px rgba(201, 160, 212, 0.2);
            text-align: center;
            border: 1px solid #f5e8f0;
        }

        .login-container .lock-icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 10px;
        }

        .login-container h2 {
            color: #6b4c7a;
            margin-bottom: 6px;
        }

        .login-container p {
            color: #b08bb8;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .login-container input {
            width: 100%;
            padding: 14px;
            border: 2px solid #f0e0f0;
            border-radius: 14px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            letter-spacing: 4px;
            background: #fdf8fc;
        }

        .login-container input:focus {
            border-color: #c9a0d4;
        }

        .login-container .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e8b4d8, #c9a0d4);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(201, 160, 212, 0.3);
        }

        .login-container .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 160, 212, 0.4);
        }

        .login-container .error-msg {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 10px;
            min-height: 24px;
        }

        .login-container .nav-link {
            display: inline-block;
            margin-top: 16px;
            color: #c9a0d4;
            text-decoration: none;
            font-weight: 600;
        }

        .login-container .nav-link:hover {
            text-decoration: underline;
            color: #b08bb8;
        }

        /* ===== ADMIN CONTENT ===== */
        #adminContent {
            display: none;
        }

        .upload-zone {
            border: 3px dashed #f0e0f0;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #fdf8fc;
        }

        .upload-zone:hover {
            border-color: #c9a0d4;
            background: #fdf0f8;
        }

        .upload-zone .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 6px;
        }

        .upload-zone .text {
            color: #b08bb8;
            font-size: 0.85rem;
        }

        .upload-zone input[type="file"] {
            display: none;
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .input-group input,
        .input-group textarea {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #f0e0f0;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            min-width: 100px;
            font-family: inherit;
            background: #fdf8fc;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: #c9a0d4;
        }

        .input-group textarea {
            min-width: 100%;
            resize: vertical;
            min-height: 60px;
        }

        .btn-add {
            padding: 10px;
            background: linear-gradient(135deg, #e8b4d8, #c9a0d4);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(201, 160, 212, 0.3);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 160, 212, 0.4);
        }

        .admin-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f5e8f0;
        }

        .admin-item:last-child {
            border-bottom: none;
        }

        .admin-item .admin-thumb {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            background: #fdf0f5;
            flex-shrink: 0;
        }

        .admin-item .admin-info {
            flex: 1;
        }

        .admin-item .admin-info .admin-title {
            font-weight: 600;
            color: #6b4c7a;
            font-size: 0.9rem;
        }

        .admin-item .admin-info .admin-date {
            font-size: 0.75rem;
            color: #b08bb8;
        }

        .admin-item .admin-delete {
            background: none;
            border: none;
            color: #e8b4d8;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .admin-item .admin-delete:hover {
            background: #fdf0f5;
            color: #e74c3c;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .stats-grid .stat-item .number {
            font-size: 1.4rem;
            font-weight: 700;
            color: #c9a0d4;
        }

        .stats-grid .stat-item .label {
            font-size: 0.65rem;
            color: #b08bb8;
        }

        .btn-reset {
            padding: 10px;
            background: #fdf0f5;
            color: #b08bb8;
            border: 2px solid #f0e0f0;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: 0.3s;
        }

        .btn-reset:hover {
            background: #f5e8f0;
            border-color: #c9a0d4;
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #b08bb8;
        }

        .empty-state .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 8px;
        }

        .btn-logout {
            padding: 10px;
            background: #f0d0d8;
            color: #b05a6a;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: #e8c0c8;
        }

        @media (max-width: 480px) {
            .input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== LOGIN ===== -->
        <div id="loginContainer" class="login-container">
            <span class="lock-icon">🔒</span>
            <h2>Acces Admin</h2>
            <p>Entre le code secret pour gerer les souvenirs</p>
            <input type="password" id="passwordInput" placeholder="Code" maxlength="10">
            <button class="btn-login" onclick="checkPassword()">Acceder</button>
            <div class="error-msg" id="errorMsg"></div>
            <a class="nav-link" href="souvenirs.html">← Aller a la Communaute</a>
        </div>

        <!-- ===== ADMIN CONTENT ===== -->
        <div id="adminContent">

            <div class="header">
                <h1>Admin</h1>
                <div class="subtitle">Gerer mes souvenirs</div>
                <a class="nav-link" href="souvenirs.html">Voir la communaute →</a>
                <button class="btn-logout" onclick="logout()">Se deconnecter</button>
            </div>

            <!-- STATS -->
            <div class="card">
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="number" id="statTotal">0</div>
                        <div class="label">Souvenirs</div>
                    </div>
                    <div class="stat-item">
                        <div class="number" id="statLikes">0</div>
                        <div class="label">Total J'aime</div>
                    </div>
                    <div class="stat-item">
                        <div class="number" id="statComments">0</div>
                        <div class="label">Commentaires</div>
                    </div>
                </div>
            </div>

            <!-- AJOUTER -->
            <div class="card">
                <h2>Ajouter un souvenir</h2>
                <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                    <span class="icon">🖼️</span>
                    <span class="text">Clique ici pour importer une photo</span>
                    <span style="font-size:0.7rem; color:#d0b8d0; display:block; margin-top:4px;">JPG, PNG, GIF, WebP (max 5MB)</span>
                    <input type="file" id="fileInput" accept="image/*">
                </div>

                <div class="input-group">
                    <input type="text" id="souvenirTitle" placeholder="Titre du souvenir...">
                    <input type="date" id="souvenirDate">
                </div>
                <div class="input-group">
                    <textarea id="souvenirText" placeholder="Raconte ce moment..."></textarea>
                </div>
                <button class="btn-add" onclick="addSouvenir()">
                    Publier le souvenir
                </button>
            </div>

            <!-- LISTE -->
            <div class="card">
                <h2>Mes souvenirs</h2>
                <div id="adminList">
                    <!-- Liste -->
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="card">
                <button class="btn-reset" onclick="resetAll()">Supprimer tous les souvenirs</button>
            </div>

        </div>

    </div>

    <script>
        // ============================================================
        // CODE SECRET
        // ============================================================
        const SECRET_CODE = '1234';

        // ============================================================
        // LOGIN
        // ============================================================
        function checkPassword() {
            const input = document.getElementById('passwordInput');
            const error = document.getElementById('errorMsg');
            const code = input.value.trim();

            if (code === SECRET_CODE) {
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                error.textContent = '';
                input.value = '';
                renderAdmin();
            } else {
                error.textContent = '❌ Code incorrect. Essaye encore.';
                input.value = '';
                input.focus();
            }
        }

        function logout() {
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('adminContent').style.display = 'none';
            document.getElementById('passwordInput').value = '';
        }

        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // ============================================================
        // DONNEES
        // ============================================================
        let souvenirs = JSON.parse(localStorage.getItem('souvenirsAlbum')) || [];

        if (souvenirs.length === 0) {
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            const dateStr = y + '-' + m + '-' + d;

            souvenirs = [
                {
                    id: 1,
                    image: '',
                    title: 'Vacances à la plage',
                    date: '2025-06-15',
                    text: 'Une superbe journee avec toute la famille, le soleil et la mer.',
                    likes: 5,
                    comments: [
                        { user: 'Sofia', text: 'Superbe photo !' },
                        { user: 'Emma', text: 'J aurais aime etre la' }
                    ]
                },
                {
                    id: 2,
                    image: '',
                    title: 'Anniversaire surprise',
                    date: '2025-03-20',
                    text: 'Mes amies ont organise une fete surprise pour mes 24 ans.',
                    likes: 8,
                    comments: [
                        { user: 'Lea', text: 'C etait magique !' }
                    ]
                }
            ];
            saveSouvenirs();
        }

        function saveSouvenirs() {
            localStorage.setItem('souvenirsAlbum', JSON.stringify(souvenirs));
        }

        let pendingImage = null;

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Le fichier n\'est pas une image.');
                this.value = '';
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                alert('L\'image est trop volumineuse (max 5MB).');
                this.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                pendingImage = event.target.result;
                document.querySelector('.upload-zone .text').textContent = '✅ ' + file.name + ' chargee !';
                document.querySelector('.upload-zone .icon').textContent = '✅';
            };
            reader.readAsDataURL(file);
        });

        function addSouvenir() {
            const title = document.getElementById('souvenirTitle').value.trim();
            const date = document.getElementById('souvenirDate').value;
            const text = document.getElementById('souvenirText').value.trim();

            if (!pendingImage) {
                alert('Importe d\'abord une photo !');
                return;
            }

            if (title === '') {
                alert('Donne un titre a ce souvenir !');
                return;
            }

            souvenirs.push({
                id: Date.now() + Math.random() * 1000,
                image: pendingImage,
                title: title,
                date: date || new Date().toISOString().split('T')[0],
                text: text || 'Aucune description',
                likes: 0,
                comments: []
            });

            pendingImage = null;
            document.getElementById('souvenirTitle').value = '';
            document.getElementById('souvenirText').value = '';
            document.getElementById('souvenirDate').value = '';
            document.getElementById('fileInput').value = '';
            document.querySelector('.upload-zone .text').textContent = 'Clique ici pour importer une photo';
            document.querySelector('.upload-zone .icon').textContent = '🖼️';

            saveSouvenirs();
            renderAdmin();
        }

        function deleteSouvenir(id) {
            if (confirm('Supprimer ce souvenir ?')) {
                souvenirs = souvenirs.filter(s => s.id !== id);
                saveSouvenirs();
                renderAdmin();
            }
        }

        function renderAdmin() {
            const container = document.getElementById('adminList');

            document.getElementById('statTotal').textContent = souvenirs.length;
            const totalLikes = souvenirs.reduce((sum, s) => sum + (s.likes || 0), 0);
            document.getElementById('statLikes').textContent = totalLikes;
            const totalComments = souvenirs.reduce((sum, s) => sum + (s.comments ? s.comments.length : 0), 0);
            document.getElementById('statComments').textContent = totalComments;

            if (souvenirs.length === 0) {
                container.innerHTML = '<div class="empty-state"><span class="icon">📸</span><p>Aucun souvenir</p></div>';
                return;
            }

            const sorted = [...souvenirs].reverse();

            container.innerHTML = sorted.map(s => `
                <div class="admin-item">
                    ${s.image ? `<img class="admin-thumb" src="${s.image}" alt="${s.title}">` : '<div class="admin-thumb" style="display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📸</div>'}
                    <div class="admin-info">
                        <div class="admin-title">${s.title}</div>
                        <div class="admin-date">${s.date} - ❤️ ${s.likes || 0} - 💬 ${s.comments ? s.comments.length : 0}</div>
                    </div>
                    <button class="admin-delete" onclick="deleteSouvenir(${s.id})">✕</button>
                </div>
            `).join('');
        }

        function resetAll() {
            if (souvenirs.length === 0) {
                alert('Aucun souvenir a supprimer.');
                return;
            }

            if (confirm('Supprimer tous les souvenirs ? Cette action est irreversible.')) {
                souvenirs = [];
                saveSouvenirs();
                renderAdmin();
            }
        }

        const today = new Date();
        document.getElementById('souvenirDate').value = today.toISOString().split('T')[0];

        document.getElementById('souvenirTitle').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('souvenirText').focus();
            }
        });

        document.getElementById('souvenirText').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.shiftKey) {
                addSouvenir();
                e.preventDefault();
            }
        });

        console.log('Admin - Mes Souvenirs prete !');

        const uploadZone = document.getElementById('uploadZone');
        uploadZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = '#c9a0d4';
            this.style.background = '#fdf0f8';
        });
        uploadZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.style.borderColor = '#f0e0f0';
            this.style.background = '#fdf8fc';
        });
        uploadZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = '#f0e0f0';
            this.style.background = '#fdf8fc';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const input = document.getElementById('fileInput');
                input.files = files;
                input.dispatchEvent(new Event('change'));
            }
        });
    </script>

</body>
</html>

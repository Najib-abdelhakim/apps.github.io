<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communaute - Mes Souvenirs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #fdf0f5;
            min-height: 100vh;
            padding: 16px;
        }

        .app {
            max-width: 550px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #e8b4d8, #c9a0d4);
            color: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(201, 160, 212, 0.3);
        }

        .header h1 { font-size: 1.6rem; }
        .header .subtitle { font-size: 0.85rem; opacity: 0.9; }

        .visitor-box {
            background: white;
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(201, 160, 212, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border: 1px solid #f5e8f0;
        }

        .visitor-box label { font-weight: 600; color: #6b4c7a; font-size: 0.9rem; }
        .visitor-box input {
            flex: 1;
            padding: 8px 14px;
            border: 2px solid #f0e0f0;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            min-width: 120px;
            background: #fdf8fc;
        }

        .visitor-box input:focus { border-color: #c9a0d4; }

        .visitor-box .visitor-name-display {
            font-weight: 600;
            color: #c9a0d4;
            font-size: 0.95rem;
            padding: 6px 14px;
            background: #fdf0f8;
            border-radius: 10px;
        }

        .visitor-box button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #e8b4d8, #c9a0d4);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(201, 160, 212, 0.3);
        }

        .visitor-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(201, 160, 212, 0.4);
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(201, 160, 212, 0.1);
            border: 1px solid #f5e8f0;
        }

        .card h2 { font-size: 1rem; color: #6b4c7a; margin-bottom: 12px; }

        .post {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(201, 160, 212, 0.1);
            border: 1px solid #f5e8f0;
        }

        .post .post-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #fdf0f5;
            cursor: pointer;
            transition: 0.3s;
        }

        .post .post-img:hover { opacity: 0.9; }

        .post .post-body { padding: 16px; }

        .post .post-title { font-size: 1.1rem; font-weight: 700; color: #6b4c7a; }
        .post .post-date { font-size: 0.8rem; color: #b08bb8; margin-top: 2px; }
        .post .post-text { font-size: 0.95rem; color: #5a4a5a; margin-top: 8px; line-height: 1.5; }

        .post .post-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f5e8f0;
            flex-wrap: wrap;
        }

        .post .post-actions button {
            padding: 6px 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .post .post-actions .like-btn { background: #fdf0f8; color: #c9a0d4; }
        .post .post-actions .like-btn:hover { background: #c9a0d4; color: white; }
        .post .post-actions .comment-btn { background: #f5e8f0; color: #b08bb8; }
        .post .post-actions .comment-btn:hover { background: #e8d4e0; }

        .post .post-comments {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f5e8f0;
        }

        .post .post-comments .comment {
            font-size: 0.85rem;
            color: #5a4a5a;
            padding: 4px 0;
            border-bottom: 1px solid #f5e8f0;
        }

        .post .post-comments .comment:last-child { border-bottom: none; }
        .post .post-comments .comment strong { color: #6b4c7a; }

        .post .comment-input-group {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .post .comment-input-group input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #f0e0f0;
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            min-width: 120px;
            background: #fdf8fc;
        }

        .post .comment-input-group input[type="text"]:focus { border-color: #c9a0d4; }

        .post .comment-input-group button {
            padding: 8px 14px;
            background: linear-gradient(135deg, #e8b4d8, #c9a0d4);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            white-space: nowrap;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(201, 160, 212, 0.3);
        }

        .post .comment-input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(201, 160, 212, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #b08bb8;
        }

        .empty-state .icon { font-size: 3rem; display: block; margin-bottom: 8px; }

        .loading-text {
            text-align: center;
            color: #b08bb8;
            padding: 20px;
            font-size: 0.9rem;
        }

        .save-status {
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            padding: 4px 0;
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeInLightbox 0.3s ease;
        }

        .lightbox.show { display: flex; }

        @keyframes fadeInLightbox {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox .lightbox-img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 12px;
            object-fit: contain;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2.8rem;
            cursor: pointer;
            background: none;
            border: none;
            transition: 0.3s;
            font-weight: 300;
        }

        .lightbox .close-lightbox:hover {
            color: #e8b4d8;
            transform: rotate(90deg);
        }

        .lightbox .lightbox-caption {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .lightbox .lightbox-caption .lb-title { font-size: 1.1rem; font-weight: 600; }
        .lightbox .lightbox-caption .lb-date { font-size: 0.85rem; opacity: 0.7; margin-top: 4px; }

        @media (max-width: 480px) {
            .post .post-img { height: 200px; }
            .post .post-actions { flex-direction: column; gap: 6px; }
            .post .post-actions button { width: 100%; justify-content: center; }
            .lightbox .close-lightbox { font-size: 2rem; top: 12px; right: 18px; }
            .lightbox .lightbox-caption { bottom: 16px; }
            .visitor-box { flex-direction: column; align-items: stretch; }
            .visitor-box input { min-width: 100%; }
            .post .comment-input-group { flex-direction: column; }
            .post .comment-input-group input[type="text"] { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="app">

        <div class="header">
            <h1>Communaute</h1>
            <div class="subtitle">Les souvenirs partages</div>
        </div>

        <!-- NOM VISITEUR -->
        <div class="visitor-box">
            <label>Votre nom :</label>
            <input type="text" id="visitorNameInput" placeholder="Entrez votre nom..." maxlength="30">
            <button onclick="setVisitorName()">OK</button>
            <span class="visitor-name-display" id="visitorNameDisplay">Visiteur</span>
        </div>

        <!-- FEED -->
        <div class="card">
            <div id="communityFeed">
                <div class="loading-text">⏳ Chargement des souvenirs...</div>
            </div>
            <div class="save-status" id="saveStatus"></div>
        </div>

    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="close-lightbox" onclick="closeLightbox(event)">✕</button>
        <img class="lightbox-img" id="lightboxImg" src="" alt="Souvenir">
        <div class="lightbox-caption">
            <div class="lb-title" id="lbTitle">Titre</div>
            <div class="lb-date" id="lbDate">Date</div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION JSONBin
        // ============================================================
        const BIN_ID = '6a9c3abbf5f4af5e296e72d0';
        const API_KEY = '$2a$10$jgTIDATCdUPLr7vDJ.2AW.OkcAvXSk1g7YHQc/29qAuc8/qmPANT.';

        // ============================================================
        // NOM DU VISITEUR
        // ============================================================
        let visitorName = localStorage.getItem('visitorName') || 'Visiteur';

        function setVisitorName() {
            const input = document.getElementById('visitorNameInput');
            const name = input.value.trim();

            if (name === '') {
                alert('Entre ton nom !');
                return;
            }

            visitorName = name;
            localStorage.setItem('visitorName', name);
            document.getElementById('visitorNameDisplay').textContent = name;
            input.value = '';
        }

        document.getElementById('visitorNameDisplay').textContent = visitorName;

        document.getElementById('visitorNameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') setVisitorName();
        });

        // ============================================================
        // DONNEES
        // ============================================================
        let souvenirs = [];
        let isSaving = false;

        // ============================================================
        // CHARGER DEPUIS LE CLOUD (AUTO)
        // ============================================================
        async function loadFromCloud() {
            const container = document.getElementById('communityFeed');
            container.innerHTML = '<div class="loading-text">⏳ Chargement des souvenirs...</div>';

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });

                if (response.ok) {
                    const data = await response.json();
                    const cloudData = data.record;

                    if (cloudData && cloudData.length > 0) {
                        souvenirs = cloudData;
                        saveLocal();
                        renderCommunity();
                        console.log('✅ Donnees chargees depuis le cloud');
                        return;
                    }
                }

                // Si pas de donnees, charger depuis local ou defaut
                loadLocal();

            } catch(e) {
                console.error('Erreur chargement:', e);
                loadLocal();
            }
        }

        // ============================================================
        // SAUVEGARDER SUR LE CLOUD (AUTO)
        // ============================================================
        async function saveToCloud() {
            if (isSaving) return;
            isSaving = true;

            const status = document.getElementById('saveStatus');
            status.textContent = '⏳ Sauvegarde...';

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(souvenirs)
                });

                if (response.ok) {
                    console.log('✅ Sauvegarde cloud reussie');
                    status.textContent = '✅ Sauvegarde ok';
                    setTimeout(() => { status.textContent = ''; }, 2000);
                } else {
                    console.error('Erreur sauvegarde:', await response.text());
                    status.textContent = '❌ Erreur sauvegarde';
                }
            } catch(e) {
                console.error('Erreur sauvegarde:', e);
                status.textContent = '❌ Erreur sauvegarde';
            }

            isSaving = false;
        }

        // ============================================================
        // SAUVEGARDE LOCALE
        // ============================================================
        function saveLocal() {
            localStorage.setItem('souvenirsAlbum', JSON.stringify(souvenirs));
        }

        function loadLocal() {
            const saved = localStorage.getItem('souvenirsAlbum');
            if (saved) {
                try {
                    souvenirs = JSON.parse(saved);
                } catch(e) {
                    souvenirs = [];
                }
            } else {
                souvenirs = [];
            }
            renderCommunity();
        }

        // ============================================================
        // LIKER (AUTO SAVE)
        // ============================================================
        async function likeSouvenir(id) {
            const s = souvenirs.find(s => s.id === id);
            if (s) {
                s.likes = (s.likes || 0) + 1;
                saveLocal();
                renderCommunity();
                await saveToCloud();
            }
        }

        // ============================================================
        // COMMENTER (AUTO SAVE)
        // ============================================================
        async function addComment(id) {
            const input = document.getElementById('commentInput_' + id);
            const text = input.value.trim();

            if (text === '') {
                alert('Ecris un commentaire !');
                return;
            }

            const name = visitorName || 'Visiteur';

            const s = souvenirs.find(s => s.id === id);
            if (s) {
                if (!s.comments) s.comments = [];
                s.comments.push({ user: name, text: text });
                saveLocal();
                renderCommunity();
                input.value = '';
                await saveToCloud();
            }
        }

        // ============================================================
        // TOGGLE COMMENTS
        // ============================================================
        function toggleComments(id) {
            const div = document.getElementById('comments_' + id);
            if (div.style.display === 'none') {
                div.style.display = 'block';
            } else {
                div.style.display = 'none';
            }
        }

        // ============================================================
        // LIGHTBOX
        // ============================================================
        function openLightbox(imageSrc, title, date) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            const titleEl = document.getElementById('lbTitle');
            const dateEl = document.getElementById('lbDate');

            img.src = imageSrc;
            titleEl.textContent = title || 'Sans titre';
            dateEl.textContent = date || 'Date inconnue';

            lightbox.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('lightbox').classList.remove('show');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox(e);
        });

        // ============================================================
        // RENDER COMMUNITY
        // ============================================================
        function renderCommunity() {
            const container = document.getElementById('communityFeed');

            if (souvenirs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📸</span>
                        <p>Aucun souvenir</p>
                        <p style="font-size:0.8rem;">Les souvenirs apparaîtront ici</p>
                    </div>
                `;
                return;
            }

            const sorted = [...souvenirs].reverse();

            container.innerHTML = sorted.map(s => `
                <div class="post">
                    ${s.image ? `<img class="post-img" src="${s.image}" alt="${s.title}" onclick="openLightbox('${s.image}', '${s.title}', '${s.date}')">` : ''}
                    <div class="post-body">
                        <div class="post-title">${s.title}</div>
                        <div class="post-date">📅 ${s.date}</div>
                        <div class="post-text">${s.text}</div>

                        <div class="post-actions">
                            <button class="like-btn" onclick="likeSouvenir(${s.id})">❤️ ${s.likes || 0}</button>
                            <button class="comment-btn" onclick="toggleComments(${s.id})">💬 ${s.comments ? s.comments.length : 0}</button>
                        </div>

                        <div class="post-comments" id="comments_${s.id}" style="display:none;">
                            ${s.comments && s.comments.length > 0 ? s.comments.map(c => `
                                <div class="comment"><strong>${c.user}</strong> : ${c.text}</div>
                            `).join('') : '<div style="color:#b08bb8; font-size:0.8rem; padding:4px 0;">Aucun commentaire</div>'}
                            <div class="comment-input-group">
                                <input type="text" id="commentInput_${s.id}" placeholder="Ecrire un commentaire...">
                                <button onclick="addComment(${s.id})">Envoyer</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ============================================================
        // STORAGE
        // ============================================================
        window.addEventListener('storage', function(e) {
            if (e.key === 'souvenirsAlbum') {
                souvenirs = JSON.parse(e.newValue) || [];
                renderCommunity();
            }
        });

        // ============================================================
        // INIT - CHARGEMENT AUTO
        // ============================================================
        loadFromCloud();

        // Recharger toutes les 30 secondes (synchronisation)
        setInterval(() => {
            loadFromCloud();
        }, 30000);

        console.log('✅ Communaute - Mes Souvenirs prete !');
        console.log('📌 BIN_ID:', BIN_ID);
        console.log('🔄 Synchronisation automatique activee (toutes les 30s)');
    </script>

</body>
</html>
